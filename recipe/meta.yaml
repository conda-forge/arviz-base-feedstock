{% set name = "arviz-base" %}
{% set version = "1.3.1" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/arviz_base-{{ version }}.tar.gz
  sha256: f83c49d1842ca93821d38bc03f1d75df18d56d507694804a07ce6c1b3bbf2d6c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.4,<4
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=2
    - xarray >=2024.11.0
    - typing_extensions >=3.10
    - lazy_loader >=0.4

test:
  imports:
    - arviz_base
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/arviz-devs/arviz-base
  summary: Base ArviZ features and converters.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://arviz-base.readthedocs.io
  dev_url: https://github.com/arviz-devs/arviz-base


extra:
  recipe-maintainers:
    - OriolAbril
    - aloctavodia
    - tomicapretto
